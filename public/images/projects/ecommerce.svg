    <rect x="64" y="136" width="130" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><rect x="76" y="148" width="106" height="80" rx="8" fill="#bfdbfe"/><text x="76" y="250" font-size="11" font-weight="700" fill="#0f172a">Headphones</text><text x="76" y="270" font-size="11" fill="#2563eb">RWF 45,000</text>
    <rect x="210" y="136" width="130" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><rect x="222" y="148" width="106" height="80" rx="8" fill="#dbeafe"/><text x="222" y="250" font-size="11" font-weight="700" fill="#0f172a">Backpack</text><text x="222" y="270" font-size="11" fill="#2563eb">RWF 28,000</text>
    <rect x="356" y="136" width="130" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><rect x="368" y="148" width="106" height="80" rx="8" fill="#bfdbfe"/><text x="368" y="250" font-size="11" font-weight="700" fill="#0f172a">Smart watch</text><text x="368" y="270" font-size="11" fill="#2563eb">RWF 90,000</text>
    <rect x="510" y="136" width="226" height="304" rx="12" fill="#0f172a"/>
