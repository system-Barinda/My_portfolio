<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="E Commerce preview">
  <rect width="800" height="500" fill="#eff6ff"/>
  <rect x="40" y="36" width="720" height="428" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M40 52a16 16 0 0 1 16-16h688a16 16 0 0 1 16 16v20H40z" fill="#f1f5f9"/>
  <circle cx="64" cy="54" r="6" fill="#ef4444"/><circle cx="84" cy="54" r="6" fill="#f59e0b"/><circle cx="104" cy="54" r="6" fill="#22c55e"/>
  <rect x="140" y="46" width="300" height="16" rx="8" fill="#e2e8f0"/>
  <text x="150" y="58" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">e-commerce.app</text>
  <g font-family="Inter, Arial, sans-serif">
