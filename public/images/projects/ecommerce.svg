    <text x="530" y="212" font-size="11" fill="#e2e8f0">HttpOnly · Secure</text>
    <text x="530" y="232" font-size="11" fill="#e2e8f0">Timeout: 30 min</text>
    <text x="530" y="270" font-size="12" font-weight="800" fill="#93c5fd">Cart (2)</text>
